name: Monthly AI-bot fetch

on:
  schedule:
    # 06:00 UTC on the 1st of every month. GitHub queues scheduled runs on a
    # best-effort basis, so the actual start time can drift by a while.
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First day to fetch (YYYY-MM-DD). Leave blank for last month."
        required: false
      end:
        description: "Last day to fetch (YYYY-MM-DD). Leave blank for last month."
        required: false
      rolling_months:
        description: "Months the rolling file covers. Ignored when start/end are set."
        required: false
        default: "6"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monthly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Radar data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Via env, not inline ${{ }}, so the inputs can't be read as shell.
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          ROLLING_MONTHS: ${{ inputs.rolling_months || '6' }}
        run: |
          if [ -n "$START" ] && [ -n "$END" ]; then
            python fetch_cf_radar_ai_bots.py --start "$START" --end "$END"
          else
            python fetch_cf_radar_ai_bots.py --rolling-months "$ROLLING_MONTHS"
          fi

      # Nothing here writes to main. The data lands on a branch and waits for a
      # human to merge the PR, so every change to the published numbers is a
      # decision someone made rather than something the cron did overnight.
      #
      # This is also what lets main carry a ruleset requiring an approving
      # review: GitHub Actions cannot be added to a ruleset bypass list, so a
      # job that pushed straight to main would simply be blocked by it.
      - name: Open a PR with the new data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          ROLLING_MONTHS: ${{ inputs.rolling_months || '6' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A rather than a pathspec: a backfill run does not write every
          # generated file, and naming a missing path makes git add fail.
          git add -A
          if git diff --staged --quiet; then
            echo "No new or changed data; nothing to commit, no PR opened."
            exit 0
          fi

          if [ -n "$START" ] && [ -n "$END" ]; then
            summary="one-off export $START to $END"
            kind="A --start/--end export. It adds a dated CSV and deliberately leaves
          radar_meta.json, key_highlights.txt and the published page alone, because
          this window sits on its own normalization scale."
          else
            summary="rolling $ROLLING_MONTHS-month refresh"
            kind="The default run. It rewrites the rolling CSV, key_highlights.txt and
          radar_meta.json, so merging this changes what the published page shows."
          fi

          # The run id, not the date: two runs on one day must not collide.
          branch="radar-data/run-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git commit -m "Update Cloudflare Radar AI-bot data ($summary)"
          git push origin "$branch"

          cat > /tmp/pr-body.md <<EOF
          Automated by \`monthly-fetch.yml\` — [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          **Window:** $summary

          $kind

          Radar applies MIN0_MAX normalization per API response, so the values in this
          PR are on a different scale from the ones currently on main. Expect whole
          columns to move, not just new rows appended — that is the rescaling, not a
          traffic spike. See
          https://developers.cloudflare.com/radar/concepts/normalization/

          If an earlier \`radar-data/\` PR is still open, these two touch the same files:
          merge the older one first or close it, otherwise the second will conflict.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Radar AI-bot data: $summary" \
            --body-file /tmp/pr-body.md

          echo "PR opened. The data is NOT on main until it is merged."
